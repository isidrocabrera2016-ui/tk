    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(160deg, #0a2540 0%, #0d3b66 100%);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        img {
            /* Tamaño máximo para que no sea gigante */
            max-width: 80%;
            max-height: 50vh;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 24px;
        }
        .btn {
            background: #25D366;
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
            transition: transform 0.2s;
            display: inline-block;
        }
        .btn:active { transform: scale(0.95); }
    </style>
</head>

    <!-- Imagen de tu creativo TKING con tamaño controlado -->
